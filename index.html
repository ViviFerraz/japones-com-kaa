<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Flashcards diários de japonês — vocabulário e kanji, dos níveis N5 ao N2. Um desafio novo por dia.">
<link rel="canonical" href="https://nihongokaa.com/">

<meta property="og:title" content="Japonês com Kaa">

<meta property="og:type" content="website">
<meta property="og:url" content="https://nihongokaa.com/">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:title" content="Japonês com Kaa">
<meta name="twitter:description" content="Flashcards diários de japonês — um desafio novo por dia.">
<meta name="twitter:image" content="https://nihongokaa.com/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A6%E2%80%8D%E2%AC%9B%3C/text%3E%3C/svg%3E">
<title>Japonês com Kaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#0A0A0B;
    --bg-grid:rgba(244,242,237,0.035);
    --surface:#131315;
    --ad-bg:#242327;
    --ad-ink:#8C8890;
    --line:#2A2930;
    --line-strong:#45434C;
    --ink:#F4F2ED;
    --ink-dim:#8C8890;
    --ink-faint:#5E5C63;
    --primary:#FF9736;
    --primary-soft:#FF973626;
    --secondary:#9B7BFF;
    --secondary-soft:#9B7BFF26;
    --danger:#FF5C6C;
    --danger-soft:#FF5C6C26;
    --focus:#FFD54A;
    --radius-block:14px;
    --radius-pill:999px;
    --btn-bg:var(--ink);
    --btn-hover:var(--primary);
  }
  /* cada nível tem seu próprio clima: grade de fundo e botões */
  :root[data-level="medium"]{
    --bg:#0E0B07;
    --bg-grid:rgba(255,151,54,.13);
    --btn-bg:#FF9736;
    --btn-hover:#FFD3A1;
  }
  :root[data-level="hard"]{
    --bg:#0E0808;
    --bg-grid:rgba(240,68,56,.14);
    --btn-bg:#F04438;
    --btn-hover:#FFAFA8;
  }
  *{ box-sizing:border-box; }
  body{
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, var(--bg-grid) 39px, var(--bg-grid) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, var(--bg-grid) 39px, var(--bg-grid) 40px),
      var(--bg);
    color:var(--ink);
    font-family:"Archivo","Hiragino Sans","Yu Gothic",sans-serif;
    line-height:1.55;
  }
  h1,h2,.wordmark,.stamp{
    font-family:"Baloo 2","Hiragino Sans","Yu Gothic",sans-serif;
  }
  h1,h2{ text-wrap:balance; }

  .page{
    max-width:640px;
    margin:0 auto;
    padding:26px 20px 40px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* topbar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .difftabs{
    display:flex;
    gap:18px;
  }
  .difftab{
    position:relative;
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    padding:4px 0 8px;
    font-family:"Archivo",sans-serif;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-dim);
    cursor:pointer;
  }
  .difftab.active{ color:var(--ink); border-bottom-color:var(--ink); }
  .difftab:hover{ color:var(--ink); }

  .wordmark{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    text-align:center;
    margin:0;
  }

  .lang-toggle{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-pill);
    padding:8px 14px;
    font-family:"Archivo",sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
  }
  .lang-toggle:hover{ border-color:var(--ink-dim); }
  .lang-toggle .chev{ font-size:10px; color:var(--ink-dim); }

  .lang-toggle:focus-visible, .difftab:focus-visible, button:focus-visible, .opt:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:3px;
  }

  hr.rule{ border:none; border-top:1px solid var(--line); margin:0; }

  .daynum{
    text-align:right;
    font-size:13px;
    font-weight:700;
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }
  .jlpt-tag{
    display:inline-block;
    margin-left:6px;
    padding:3px 8px;
    border:1px solid var(--line);
    border-radius:var(--radius-pill);
    font-size:11px;
    letter-spacing:.04em;
    color:var(--ink-dim);
  }

  /* ad slots */
  .adslot{
    background:var(--ad-bg);
    border:1px solid var(--line);
    border-radius:var(--radius-block);
    height:80px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:10px 20px;
  }
  #adTop{ margin-top:58px; }
  .adslot span{
    font-size:11px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ad-ink);
  }
  .adslot .chev{
    position:absolute;
    right:18px;
    color:var(--ad-ink);
    opacity:.6;
    font-size:16px;
  }
  @media (max-width:560px){
    .adslot{
      width:100vw;
      margin-left:calc(50% - 50vw);
      margin-right:calc(50% - 50vw);
      border-radius:0;
      border-left:none;
      border-right:none;
    }
  }

  /* home / start screen */
  .home{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:6px;
    padding:8px 0 4px;
  }
  .mascot{
    width:132px;
    margin:0 auto 6px;
  }
  .mascot img{ width:100%; height:auto; display:block; }
  .home h2{
    font-size:20px;
    font-weight:700;
    margin:0 0 22px;
  }
  .home-actions{
    display:flex;
    flex-direction:column;
    gap:20px;
    width:100%;
    max-width:320px;
  }
  .game-action-group{
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
  }

  /* buttons */
  .btn{
    font-family:"Archivo",sans-serif;
    font-weight:700;
    font-size:14px;
    border-radius:var(--radius-pill);
    padding:14px 22px;
    cursor:pointer;
    border:1px solid transparent;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  @media (prefers-reduced-motion: reduce){ .btn:active{ transform:none; } }

  .btn-white{
    position:relative;
    background:var(--btn-bg);
    color:#1C1B1F;
    overflow:hidden;
    z-index:0;
    transition:transform .3s ease;
  }
  .btn-white::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--btn-hover);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .6s cubic-bezier(.22,1,.36,1);
    z-index:-1;
  }
  .btn-white:hover::before, .btn-white:focus-visible::before{ transform:scaleX(1); }
  .btn-white:hover, .btn-white:focus-visible{ transform:scale(1.02); }
  @media (prefers-reduced-motion: reduce){
    .btn-white{ transition:none; }
    .btn-white::before{ transition:opacity .2s ease; transform:none; opacity:0; }
    .btn-white:hover::before{ opacity:1; }
    .btn-white:hover, .btn-white:focus-visible{ transform:none; }
  }
  .btn-outline{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-outline:hover{ border-color:var(--ink-dim); }
  .btn-full{ width:100%; }

  .today-pill{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-pill);
    padding:10px 16px;
    font-size:12.5px;
    font-weight:700;
    white-space:nowrap;
  }
  .today-pill .grid-preview{ font-size:12px; letter-spacing:.5px; white-space:nowrap; }
  .btn-copy-text{
    background:none;
    border:none;
    color:var(--ink-dim);
    font-family:"Archivo",sans-serif;
    font-size:12.5px;
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    padding:2px 4px;
  }
  .btn-copy-text:hover{ color:var(--ink); }

  .btn-tiktok{
    width:100%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--ink);
    border-radius:var(--radius-pill);
    padding:13px 20px;
    font-family:"Archivo",sans-serif;
    font-size:13.5px;
    font-weight:700;
    text-decoration:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn-tiktok:hover{ border-color:var(--primary); background:rgba(255,151,54,.08); }
  .btn-tiktok .tt-icon{
    width:22px; height:22px;
    border-radius:6px;
    background:var(--ink);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .btn-tiktok .tt-icon svg{ width:12px; height:12px; }

  /* aviso que aparece depois de copiar o resultado */
  .toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(12px);
    z-index:50;
    display:flex;
    align-items:center;
    gap:14px;
    max-width:min(460px, calc(100vw - 32px));
    background:var(--surface);
    border:1px solid var(--line-strong);
    border-radius:16px;
    padding:14px 16px;
    box-shadow:0 18px 40px -12px rgba(0,0,0,.7);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .toast-text{ font-size:13px; font-weight:700; line-height:1.35; }
  .toast-text small{ display:block; font-weight:600; color:var(--ink-dim); font-size:12px; margin-top:2px; }
  .toast .btn-tiktok{ width:auto; white-space:nowrap; padding:10px 16px; font-size:12.5px; }
  .toast-close{
    background:none; border:none; color:var(--ink-dim);
    font-size:18px; line-height:1; cursor:pointer; padding:2px 4px;
  }
  .toast-close:hover{ color:var(--ink); }
  @media (max-width:520px){
    .toast{ flex-wrap:wrap; padding-right:38px; }
    .toast .btn-tiktok{ width:100%; }
    .toast-close{ position:absolute; top:10px; right:10px; }
  }
  @media (prefers-reduced-motion: reduce){
    .toast{ transition:opacity .15s ease; transform:translateX(-50%); }
    .toast.show{ transform:translateX(-50%); }
  }
  .streak-line{ font-size:12.5px; font-weight:700; color:var(--ink-dim); margin-top:4px; }

  /* quiz panel */
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-block);
    padding:24px 20px;
    --accent:var(--primary);
    --accent-soft:var(--primary-soft);
  }
  .panel[data-game="vocab"]{ --accent:var(--primary); --accent-soft:var(--primary-soft); }
  .panel[data-game="kanji"]{ --accent:var(--secondary); --accent-soft:var(--secondary-soft); }

  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:6px;
  }
  .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .btn-exit{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    width:28px; height:28px;
    border-radius:50%;
  }
  .btn-exit:hover{ color:var(--ink); border-color:var(--ink-dim); }

  .dots{ display:flex; gap:7px; margin:16px 0 22px; justify-content:center; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--line); }
  .dot.done-right{ background:var(--accent); }
  .dot.done-wrong{ background:var(--danger); }
  .dot.current{ outline:2px solid var(--ink-dim); outline-offset:2px; }

  .prompt{ position:relative; text-align:center; padding:2px 6px 24px; }
  .prompt .jp-char{
    font-size:clamp(40px,12vw,56px);
    font-weight:700;
    display:block;
    line-height:1.1;
    font-family:"Baloo 2","Hiragino Sans","Yu Gothic",sans-serif;
  }
  .prompt .reading{
    display:block;
    margin-top:10px;
    font-size:13.5px;
    color:var(--ink-dim);
    font-weight:600;
    letter-spacing:.03em;
  }
  .prompt .ask{
    display:block;
    margin-top:12px;
    font-size:12.5px;
    color:var(--ink-dim);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
  }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:420px){ .options{ grid-template-columns:1fr; } }
  .opt{
    position:relative;
    font-family:"Archivo",sans-serif;
    font-size:14px;
    font-weight:600;
    text-align:center;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:var(--radius-pill);
    height:48px;
    padding:0 32px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .options:not(.no-hover) .opt:hover:not(:disabled){ border-color:var(--ink-dim); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:var(--accent-soft); border-color:var(--accent); }
  .opt.wrong{ background:var(--danger-soft); border-color:var(--danger); }
  .opt-mark{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    font-size:14px;
    line-height:1;
  }

  .confetti-piece{
    position:absolute;
    width:7px; height:7px;
    border-radius:2px;
    pointer-events:none;
    animation:confetti-burst .8s ease-out forwards;
  }
  @keyframes confetti-burst{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .confetti-piece{ animation:none; opacity:0; }
  }

  .feedback{
    min-height:18px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    margin-top:18px;
  }
  .feedback.right{ color:var(--accent); }
  .feedback.wrong{ color:var(--danger); }

  /* results */
  .results{ text-align:center; padding:4px 4px 0; }
  .stamp{
    width:72px; height:72px;
    margin:0 auto 16px;
    background:var(--ink);
    color:#1C1B1F;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:800;
    transform:rotate(-6deg);
    box-shadow:0 10px 22px -8px rgba(0,0,0,.5);
  }
  .results .score-big{ font-size:28px; font-weight:800; margin:0 0 4px; }
  .results .grid-preview{ font-size:18px; letter-spacing:5px; margin-bottom:20px; }
  .results-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* footer */
  footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    font-size:12.5px;
    color:var(--ink-dim);
  }
  footer .brand-name{ color:var(--ink); font-weight:700; }
  .socials{ display:flex; align-items:center; gap:8px; }
  .social-badge{
    width:30px; height:30px;
    border-radius:9px;
    background:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:transform .15s ease, filter .15s ease;
  }
  .social-badge svg{ width:16px; height:16px; display:block; }
  .social-badge:hover{ transform:translateY(-2px); filter:brightness(.9); }

  [hidden]{ display:none !important; }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <nav class="difftabs" id="difftabs"></nav>
    <button class="lang-toggle" id="langToggle" type="button"></button>
  </div>
  <div class="wordmark">Kaa! ensina japonês</div>
  <hr class="rule">
  <div class="daynum" id="daynum"></div>

  <section id="home" class="home"></section>

  <div class="adslot" id="adTop"><span></span><span class="chev">›</span></div>

  <section class="panel" id="panel" hidden></section>

  <div class="adslot" id="adBottom"><span></span><span class="chev">›</span></div>

  <hr class="rule">
  <footer>
    <span id="footerText"></span>
    <span class="socials">
      <a class="social-badge" data-tiktok-link href="https://www.tiktok.com/@japonescomkaa" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.5 3c.4 2.2 2 3.9 4.3 4.2v3.1c-1.6.1-3-.4-4.3-1.3v6.6c0 3.4-2.7 6.1-6.1 6.1S4.3 19 4.3 15.6c0-3.3 2.6-6 5.9-6.1v3.2c-1.5.2-2.7 1.5-2.7 3 0 1.7 1.4 3 3 3s3-1.4 3-3V3h3z" fill="#1C1B1F"/>
        </svg>
      </a>
      <a class="social-badge" href="https://www.instagram.com/nihongokaa/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.2" stroke="#1C1B1F" stroke-width="2.1"/>
          <circle cx="12" cy="12" r="4.1" stroke="#1C1B1F" stroke-width="2.1"/>
          <circle cx="17.4" cy="6.7" r="1.35" fill="#1C1B1F"/>
        </svg>
      </a>
      <a class="social-badge" href="https://www.youtube.com/@japonescomkaa" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="5" width="20" height="14" rx="4.6" fill="#1C1B1F"/>
          <path d="M10.2 8.9v6.2l5.3-3.1z" fill="#F4F2ED"/>
        </svg>
      </a>
    </span>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="toast-text" id="toastText"></span>
  <a class="btn-tiktok" id="toastCta" data-tiktok-link href="https://www.tiktok.com/@japonescomkaa" target="_blank" rel="noopener noreferrer">
    <span class="tt-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16.5 3c.4 2.2 2 3.9 4.3 4.2v3.1c-1.6.1-3-.4-4.3-1.3v6.6c0 3.4-2.7 6.1-6.1 6.1S4.3 19 4.3 15.6c0-3.3 2.6-6 5.9-6.1v3.2c-1.5.2-2.7 1.5-2.7 3 0 1.7 1.4 3 3 3s3-1.4 3-3V3h3z" fill="#1C1B1F"/>
      </svg>
    </span>
    <span id="toastCtaText"></span>
  </a>
  <button class="toast-close" id="toastClose" aria-label="Fechar">×</button>
</div>

<script>
(function(){

  // Para apontar o botão "Abrir TikTok" para um vídeo específico, troque a URL
  // abaixo pelo link do post (ex: "https://www.tiktok.com/@japonescomkaa/video/123...").
  // Deixando o link do perfil, o TikTok abre o feed com o post mais recente no topo.
  var TIKTOK_URL = "https://www.tiktok.com/@japonescomkaa";

  // ---------- i18n ----------
  var STRINGS = {
    pt: {
      wordmark:"Kaa! ensina japonês",
      diffEasy:"Fácil", diffMed:"Médio", diffHard:"Difícil",
      mascotFx:"カアア!",
      homeQuestion:"Consegue acertar as palavras do dia?",
      vocabEyebrow:"Vocabulário", kanjiEyebrow:"Kanji",

  var VOCAB = VOCAB_RAW.map(function(a){
    return { kana:a[0], kanji:a[1], reading:a[2], meaning:{ pt:a[3], en:a[4] }, jlpt:a[5] };
  });
  var KANJI = KANJI_RAW.map(function(a){
    return { kana:a[0], kanji:a[0], reading:a[1], meaning:{ pt:a[2], en:a[3] }, jlpt:a[4] };
  });

    vocab: { all:VOCAB, showReading:true },
    kanji: { all:KANJI, showReading:false }
  };

  var LEVELS = {
    easy:   { jlpt:["N5","N4"], label:"N5–N4" },
    medium: { jlpt:["N4","N3"], label:"N4–N3" },
    hard:   { jlpt:["N3","N2"], label:"N3–N2" }
  };
  var LEVEL_ORDER = ["easy","medium","hard"];

  var listCache = {};
  function listFor(game, level){
    var key = game + ":" + level;
    if (!listCache[key]){
      var allowed = LEVELS[level].jlpt;
      listCache[key] = GAMES[game].all.filter(function(item){
        return allowed.indexOf(item.jlpt) !== -1;
      });
    }
    return listCache[key];
  }

  // no nível fácil o vocabulário aparece em kana; nos demais, em kanji
  function promptText(game, level, item){
    return (game === "vocab" && level === "easy") ? item.kana : item.kanji;
  }

  // ---------- deterministic daily picks ----------
  function xmur3(str){
    var h = 1779033703 ^ str.length;
    for (var i=0;i<str.length;i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h<<13) | (h>>>19);
    }
    return function(){
      h = Math.imul(h ^ (h>>>16), 2246822507);
      h = Math.imul(h ^ (h>>>13), 3266489909);
      return (h ^= h>>>16) >>> 0;
    };
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a>>>15), 1 | a);
      t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
      return ((t ^ (t>>>14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rand){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(rand()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  var QUESTIONS_PER_DAY = 7;

  function pickDaily(game, level, dateKey){
    var seedGen = xmur3(dateKey+"::"+game+"::"+level);
    var rand = mulberry32(seedGen());
    var list = listFor(game, level);
    var all = list.map(function(_,i){ return i; });
    var chosen = shuffle(all, rand).slice(0, QUESTIONS_PER_DAY);
    return chosen.map(function(idx){
      var pool = shuffle(all.filter(function(i){ return i!==idx; }), rand).slice(0,3);
      var opts = shuffle([idx].concat(pool), rand);
      return { idx:idx, opts:opts, correctIndex:opts.indexOf(idx) };
    });
  }

  // ---------- dates ----------
  function pad(n){ return String(n).padStart(2,"0"); }
  function keyFromDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayKey(){ return keyFromDate(new Date()); }
  function yesterdayKey(key){
    var d = new Date(key+"T00:00:00");
    d.setDate(d.getDate()-1);
    return keyFromDate(d);
  }
  function dayNumber(key){
    var launchDay = new Date("2026-09-18T00:00:00");
    var d = new Date(key+"T00:00:00");
    return Math.round((d-launchDay)/86400000) + 1;
  }

  // ---------- persisted per-game state ----------
  // o nível fácil mantém a chave antiga, para não zerar as sequências de quem já jogava
  function stateKey(game, level){
    return level === "easy" ? ("jck_" + game) : ("jck_" + level + "_" + game);
  }
  function loadState(game, level){
    try{
      var raw = localStorage.getItem(stateKey(game, level));
      if (raw) return JSON.parse(raw);
    }catch(e){}
    return { lastDateKey:null, lastScore:0, lastGrid:[], streak:0, longest:0 };
  }
  function saveState(game, level, st){
    try{ localStorage.setItem(stateKey(game, level), JSON.stringify(st)); }catch(e){}
  }

  function renderChrome(){
    var s = S();
    document.querySelector(".wordmark").textContent = s.wordmark;
    document.getElementById("footerText").innerHTML = s.footer;
    document.querySelectorAll(".adslot span:first-child").forEach(function(el){ el.textContent = s.adLabel; });
    daynumEl.innerHTML = '#' + dayNumber(todayKey())
      + ' <span class="jlpt-tag">' + LEVELS[app.level].label + '</span>';
    langToggle.innerHTML = (app.lang === "pt" ? "🇧🇷 pt-br" : "🇺🇸 en-us") + ' <span class="chev">▾</span>';
    document.querySelectorAll("[data-tiktok-link]").forEach(function(el){ el.href = TIKTOK_URL; });

    document.documentElement.setAttribute("data-level", app.level);

    var labelKeys = { easy:"diffEasy", medium:"diffMed", hard:"diffHard" };
    difftabsEl.innerHTML = LEVEL_ORDER.map(function(lv){
      return '<button class="difftab' + (lv === app.level ? " active" : "") + '" data-level="' + lv + '">'
        + s[labelKeys[lv]] + '</button>';
    }).join("");

    difftabsEl.querySelectorAll("[data-level]").forEach(function(btn){
      btn.addEventListener("click", function(){ setLevel(btn.getAttribute("data-level")); });
    });
  }

  function setLevel(level){
    if (level === app.level || !LEVELS[level]) return;
    app.level = level;
    saveLevel(level);
    app.activeGame = null;
    app.questions = null;
    app.qIndex = 0;
    app.grid = [];
    app.answered = false;
    hideToast();
    render();
  }

  function renderHome(){
    panelEl.hidden = true;
    homeEl.hidden = false;
    adTopEl.hidden = false;
    var s = S();
    var key = todayKey();

    var actions = GAME_ORDER.map(function(game){
      var st = loadState(game, app.level);
      var playedToday = st.lastDateKey === key;
      var label = playedToday ? s.playAgain : (game==="vocab" ? s.playVocab : s.playKanji);
      var html = '<div class="game-action-group">'
        + '<button class="btn btn-white btn-full" data-play="' + game + '">' + label + '</button>';
      if (playedToday){
        html += '<div class="today-pill">'
          + '<span>' + (game==="vocab"?s.vocabEyebrow:s.kanjiEyebrow) + ' ' + st.lastScore + '/' + QUESTIONS_PER_DAY + '</span>'
          + '<span class="grid-preview">' + squareRow(st.lastGrid) + '</span>'
          + '</div>'
          + '<button class="btn-copy-text" data-copy="' + game + '">' + s.copy + '</button>';
      }
      html += '</div>';
      return html;
    }).join("");

    homeEl.innerHTML = ""
      + '<div class="mascot">' + mascotImg(s.mascotFx) + '</div>'
      + '<h2>' + s.homeQuestion + '</h2>'
      + '<div class="home-actions">' + actions + '</div>';

    homeEl.querySelectorAll("[data-play]").forEach(function(btn){
      btn.addEventListener("click", function(){ startGame(btn.getAttribute("data-play")); });
    });
    homeEl.querySelectorAll("[data-copy]").forEach(function(btn){
      btn.addEventListener("click", function(){ copyResult(btn.getAttribute("data-copy")); });
    });
    app.activeGame = null;
  }

  function showToast(){
    var s = S();
    toastTextEl.innerHTML = s.toastCopied + '<small>' + s.toastHint + '</small>';
    toastCtaTextEl.textContent = s.toastCta;
    toastEl.classList.add("show");
    clearTimeout(toastEl._hideTimer);
    toastEl._hideTimer = setTimeout(hideToast, 9000);
  }
  function hideToast(){
    clearTimeout(toastEl._hideTimer);
    toastEl.classList.remove("show");
  }

  function copyResult(game){
    var st = loadState(game, app.level);
    var key = todayKey();
    var s = S();
    var label = game === "vocab" ? s.vocabEyebrow : s.kanjiEyebrow;
    var levelName = s[{ easy:"diffEasy", medium:"diffMed", hard:"diffHard" }[app.level]];
    var text = s.shareText(label, levelName, dayNumber(key), st.lastScore, QUESTIONS_PER_DAY, squareRow(st.lastGrid));
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(function(){});
    }
    showToast();
  }

  function startGame(game){
    var key = todayKey();
    app.activeGame = game;
    app.questions = pickDaily(game, app.level, key);
    app.qIndex = 0;
    app.grid = [];
    app.answered = false;
    homeEl.hidden = true;
    panelEl.hidden = false;
    adTopEl.hidden = true;
    renderQuiz();
  }

  function exitToHome(){
    app.activeGame = null;
    app.questions = null;
    renderHome();
  }

  function renderQuiz(){
    var s = S();
    var game = app.activeGame;
    var conf = GAMES[game];
    var list = listFor(game, app.level);
    var q = app.questions[app.qIndex];
    var item = list[q.idx];
    panelEl.setAttribute("data-game", game);

    var dots = app.questions.map(function(_, i){
      var cls = "dot";
      if (i < app.grid.length) cls += app.grid[i] ? " done-right" : " done-wrong";
      else if (i === app.qIndex) cls += " current";
      return '<span class="' + cls + '"></span>';
    }).join("");

    panelEl.innerHTML = ""
      + '<div class="panel-head">'
      + '<span class="eyebrow">' + (game==="vocab"?s.vocabEyebrow:s.kanjiEyebrow) + " · " + (app.qIndex+1) + "/" + app.questions.length + '</span>'
      + '<button class="btn-exit" aria-label="' + s.exit + '" id="exitBtn">×</button>'
      + '</div>'
      + '<div class="dots">' + dots + '</div>'
      + '<div class="prompt">'
      + '<span class="jp-char">' + promptText(game, app.level, item) + '</span>'
      + (conf.showReading ? '<span class="reading">' + item.reading + '</span>' : '')
      + '<span class="ask">' + s.ask + '</span>'
      + '</div>'
      + '<div class="options no-hover">' + q.opts.map(function(optIdx,i){
          return '<button class="opt" type="button" data-i="' + i + '">' + list[optIdx].meaning[app.lang] + '</button>';
        }).join("") + '</div>'
      + '<div class="feedback" id="feedback"></div>';

    document.getElementById("exitBtn").addEventListener("click", exitToHome);
    panelEl.querySelectorAll(".opt").forEach(function(btn){
      btn.addEventListener("click", function(){ selectAnswer(parseInt(btn.getAttribute("data-i"),10)); });
    });

    // o hover só vale depois que o mouse realmente se mexe: sem isso o botão que
    // nasce sob o cursor já aparece destacado na pergunta seguinte
    var optionsEl = panelEl.querySelector(".options");
    if (optionsEl){
      document.addEventListener("pointermove", function enableHover(){
        optionsEl.classList.remove("no-hover");
        document.removeEventListener("pointermove", enableHover);
      });
    }
  }

  function selectAnswer(i){
    if (app.answered) return;
    app.answered = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    var s = S();
    var game = app.activeGame;
    var conf = GAMES[game];
    var q = app.questions[app.qIndex];
    var item = listFor(game, app.level)[q.idx];
    var ok = i === q.correctIndex;
    app.grid.push(ok);

    var opts = panelEl.querySelectorAll(".opt");
    opts.forEach(function(btn, idx){
      btn.disabled = true;
      var mark = document.createElement("span");
      mark.className = "opt-mark";
      if (idx === q.correctIndex) { btn.classList.add("correct"); mark.textContent = "🥚"; btn.appendChild(mark); }
      else if (idx === i) { btn.classList.add("wrong"); mark.textContent = "❌"; btn.appendChild(mark); }
    });
    var fb = document.getElementById("feedback");
    fb.textContent = ok ? s.correct : (s.wasPrefix + " " + item.meaning[app.lang]);
    fb.className = "feedback " + (ok ? "right" : "wrong");

    var revealedReading = false;
    if (!conf.showReading){
      var jpChar = panelEl.querySelector(".jp-char");
      if (jpChar){
        var readingSpan = document.createElement("span");
        readingSpan.className = "reading";
        readingSpan.textContent = item.reading;
        jpChar.insertAdjacentElement("afterend", readingSpan);
        revealedReading = true;
      }
    }

    if (ok) spawnConfetti(panelEl.querySelector(".prompt"));

    var delay = revealedReading ? (ok ? 2400 : 2200) : (ok ? 1100 : 950);
    setTimeout(function(){
      app.qIndex += 1;
      app.answered = false;
      if (app.qIndex >= app.questions.length) renderResults();
      else renderQuiz();
    }, delay);
  }

  function spawnConfetti(container){
    if (!container) return;
    var colors = ["#4CAF6D","#6FCF87","#2ECC71","#8BE3A6","#3DDC84"];
    for (var i=0;i<16;i++){
      var piece = document.createElement("span");
      piece.className = "confetti-piece";
      var angle = Math.random() * Math.PI * 2;
      var dist = 36 + Math.random() * 46;
      piece.style.setProperty("--dx", (Math.cos(angle) * dist) + "px");
      piece.style.setProperty("--dy", (Math.sin(angle) * dist - 18) + "px");
      piece.style.setProperty("--rot", (Math.random() * 360 - 180) + "deg");
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.left = (44 + Math.random() * 12) + "%";
      piece.style.top = (30 + Math.random() * 12) + "%";
      container.appendChild(piece);
      (function(p){ setTimeout(function(){ p.remove(); }, 850); })(piece);
    }
  }

  function renderResults(){
    var s = S();
    var game = app.activeGame;
    var key = todayKey();
    var score = app.grid.filter(Boolean).length;
    var st = loadState(game, app.level);

    var newStreak;
    if (st.lastDateKey === key) newStreak = st.streak;
    else if (st.lastDateKey === yesterdayKey(key)) newStreak = st.streak + 1;
    else newStreak = 1;

    saveState(game, app.level, {
      lastDateKey:key, lastScore:score, lastGrid:app.grid,
      streak:newStreak, longest:Math.max(newStreak, st.longest||0)
    });

    var passThreshold = Math.ceil(QUESTIONS_PER_DAY * 0.75);

    panelEl.innerHTML = ""
      + '<div class="panel-head">'
      + '<span class="eyebrow">' + (game==="vocab"?s.vocabEyebrow:s.kanjiEyebrow) + '</span>'
      + '<button class="btn-exit" aria-label="' + s.exit + '" id="closeBtn">×</button>'
      + '</div>'
      + '<div class="results">'
      + '<div class="stamp">' + (score>=passThreshold ? "合格" : "又") + '</div>'
      + '<p class="score-big">' + score + ' / ' + app.grid.length + '</p>'
      + '<p class="streak-line">🔥 ' + s.streak(newStreak) + '</p>'
      + '<div class="grid-preview">' + squareRow(app.grid) + '</div>'
      + '<div class="results-actions">'
      + '<button class="btn btn-outline" id="copyBtn">' + s.copy + '</button>'
      + '<button class="btn btn-white" id="backBtn">' + s.back + '</button>'
      + '</div>'
      + '</div>';

    document.getElementById("closeBtn").addEventListener("click", exitToHome);
    document.getElementById("backBtn").addEventListener("click", exitToHome);
    document.getElementById("copyBtn").addEventListener("click", function(){ copyResult(game); });
  }

  function render(){
    if (!LEVELS[app.level]) app.level = "easy";
    renderChrome();
    if (app.activeGame && Array.isArray(app.questions) && app.questions.length){
      homeEl.hidden = true;
      panelEl.hidden = false;
      adTopEl.hidden = true;
      if (app.qIndex >= app.questions.length) renderResults();
      else renderQuiz();
    } else {
      renderHome();
    }
  }

  langToggle.addEventListener("click", function(){
    app.lang = app.lang === "pt" ? "en" : "pt";
    saveLang(app.lang);
    render();
  });

  if (window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return app; });
    if (window.claude.hot.ready) window.claude.hot.ready(function(data){ app = Object.assign(app, data||{}); render(); });
    else render();
  } else {
    render();
  }
})();
</script>

</body>
</html>
